[package]
name = "draw-core"
description = "DRAW 2 card recognition: one frame in, detections out."
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "draw_core"

[features]
# Test double for consumers: `FakeRecognizer` returns configured detections.
fake = []

[dependencies]
# ONNX Runtime, CPU only here. Pinned exactly because 2.x is still a release candidate.
# The default `download-binaries` feature fetches prebuilt ONNX Runtime at build time.
ort = "=2.0.0-rc.15"
# Reading the classifier's label files (JSON).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"

[dev-dependencies]
# Decoding the test fixtures: JPEG frames, and the lossless PNG crops the classifier
# reference was computed on. The library itself reads RGBA8 frames and resizes and warps
# them by hand, so it needs no image crate.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
