name: Rust

on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

# The model files the golden tests run: the detector, the int8 and fp32 classifiers and
# their labels. Must match `ModelManifest::PINNED` (crates/draw-core/src/manifest.rs):
# MODELS_URL embeds its pinned commit, and the cache is keyed by every SHA-256, so change
# them together (with the fixture scripts in crates/draw-core/tests/fixtures/).
env:
  MODELS_URL: https://huggingface.co/HichTala/draw2/resolve/7a690eecf6aef5c812ba9a5a1d3e1ced4968b5b3/onnx
  DETECTOR_SHA256: 449e0d42cbf8429b170abf44d50cda29beeeb05dc80890102e12c06d6358cf97
  VIT_INT8_SHA256: f2da9ce6b2c02498e0c9f8fc0b7817eeebd88bfe8491c8c7f83055dfd57e5b4a
  VIT_FP32_SHA256: 8e6b63c64e081f6f5326adf0c758247bb88764224c2380d547e9c9005e574ca4
  LABELS_SHA256: 70d13d586eee498b33ee493b48cd564fbffcb99b0476897978de1fd7d856f639

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # rustup reads rust-toolchain.toml (pinned version + rustfmt, clippy).
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Cache model files
        id: models-cache
        uses: actions/cache@v4
        with:
          path: .models
          key: draw-core-models-${{ env.DETECTOR_SHA256 }}-${{ env.VIT_INT8_SHA256 }}-${{ env.VIT_FP32_SHA256 }}-${{ env.LABELS_SHA256 }}

      - name: Download model files
        if: steps.models-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .models
          for file in ygo_yolo.onnx vit_int8.onnx vit_fp32.onnx cardnames_onnx.json; do
            curl -fsSL --retry 3 -o ".models/$file" "$MODELS_URL/$file"
          done

      # Verified on every run, cache hit or not. macOS has shasum, Git Bash on Windows
      # has sha256sum.
      - name: Verify model files
        shell: bash
        run: |
          status=0
          while read -r file expected; do
            if command -v sha256sum >/dev/null; then
              sum=$(sha256sum ".models/$file")
            else
              sum=$(shasum -a 256 ".models/$file")
            fi
            actual=${sum%% *}
            if [ "$actual" != "$expected" ]; then
              echo "::error::$file has SHA-256 $actual, expected $expected"
              status=1
            fi
          done <<EOF
          ygo_yolo.onnx $DETECTOR_SHA256
          vit_int8.onnx $VIT_INT8_SHA256
          vit_fp32.onnx $VIT_FP32_SHA256
          cardnames_onnx.json $LABELS_SHA256
          EOF
          exit $status

      # DRAW_CORE_MODELS_DIR makes the golden detection and classification tests run
      # instead of skipping.
      - name: cargo test
        run: cargo test --workspace --all-features
        env:
          DRAW_CORE_MODELS_DIR: ${{ github.workspace }}/.models

      # Checks the crate without the `fake` feature, as it builds by default.
      - name: cargo test (no features)
        run: cargo test --workspace
        env:
          DRAW_CORE_MODELS_DIR: ${{ github.workspace }}/.models
